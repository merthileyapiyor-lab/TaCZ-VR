modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "horio"
description = '''
Vivecraft x TACZ compatibility.
- VR players hold TACZ guns as real 3D models in their controller, with reload/shoot animations.
- Bullets leave the muzzle in the direction the gun is pointing.
- Two-handed grip by bringing the off-hand to the handguard.
- Bring the sights to your eye to aim (tighter spread).
- Automatic reload when the magazine is empty, or tap the magazine with the off-hand.
- Everyone with this mod sees VR players holding their gun in 3D, pointing where they aim.
'''
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tacz"
mandatory = true
versionRange = "[1.1.8,)"
ordering = "AFTER"
side = "BOTH"

# a VR mod: Vivecraft or Visor. Without either the guns work flat screen only, the rest of the mod works
[[dependencies.${mod_id}]]
modId = "vivecraft"
mandatory = false
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "visor"
mandatory = false
# 0.6.0-alpha sorts before 0.6
versionRange = "[0.6.0-alpha.1,)"
ordering = "AFTER"
side = "BOTH"

# the radio talks through it, everything else works without
[[dependencies.${mod_id}]]
modId = "voicechat"
mandatory = false
versionRange = "*"
ordering = "NONE"
side = "BOTH"
