plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        client {
            // -Prundir=run-gunpacks keeps a separate game folder, for gun packs the normal checks shouldn't see
            workingDirectory project.file(project.findProperty('rundir') ?: 'run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            if (project.hasProperty('selftest')) {
                property 'taczvr.selftest', 'true'
                property 'taczvr.selftest.exit', 'true'
                if (project.hasProperty('testonly')) {
                    property 'taczvr.selftest.only', project.property('testonly')
                }
                // -Ppacks=ccrp,ww2 tests only these gun pack namespaces
                if (project.hasProperty('packs')) {
                    property 'taczvr.selftest.packs', project.property('packs')
                }
                // -Pupdatelive also asks the real GitHub releases page
                if (project.hasProperty('updatelive')) {
                    property 'taczvr.update.live', 'true'
                }
            }
            mods {
                taczvr {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'taczvr.refmap.json'
    config 'taczvr.mixins.json'
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"

    compileOnly fg.deobf("maven.modrinth:vivecraft:${vivecraft_version}")
    compileOnly fg.deobf("maven.modrinth:timeless-and-classics-zero:${tacz_version}")
    // only for the dev client (./gradlew runClient), never shipped
    runtimeOnly fg.deobf("maven.modrinth:vivecraft:${vivecraft_version}")
    runtimeOnly fg.deobf("maven.modrinth:timeless-and-classics-zero:${tacz_version}")
    // the radio talks through Simple Voice Chat when it's installed, the mod works without it
    compileOnly fg.deobf("maven.modrinth:simple-voice-chat:${voicechat_version}")
    // -Pnovoice runs the dev client without it, to check the mod still works
    if (!project.hasProperty('novoice')) {
        runtimeOnly fg.deobf("maven.modrinth:simple-voice-chat:${voicechat_version}")
    }

    // Minecraft 1.19.2 has no JOML (it came with 1.19.3). Vivecraft brings its own copy, we ship one too so the mod
    // also loads without Vivecraft; Forge loads only the newest of them
    compileOnly 'org.joml:joml:1.10.8'
    jarJar(group: 'org.joml', name: 'joml', version: '[1.10.8,)') {
        // JOML's pom lists Kotlin for its Kotlin helpers; plain Java doesn't need it, and a bundled Kotlin could clash
        transitive = false
        jarJar.pin(it, '1.10.8')
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jarJar.enable()
reobf {
    jarJar {}
}

def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version
]
processResources {
    inputs.properties replaceProperties
    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

tasks.withType(Jar).matching { it.name == 'jar' || it.name == 'jarJar' }.configureEach {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'MixinConfigs'          : 'taczvr.mixins.json'
        ])
    }
}
// the jar with JOML inside is the one to ship, the plain one is only the slim leftover
jar {
    archiveClassifier = 'slim'
    finalizedBy 'reobfJar'
}
tasks.named('jarJar') {
    archiveClassifier = ''
    finalizedBy 'reobfJarJar'
}
tasks.named('build') {
    dependsOn 'jarJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs << '-Xmaxerrs' << '5000'
}
